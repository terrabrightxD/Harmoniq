name: Windows build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained EXE
        run: dotnet publish CrateScope.csproj -c Release -o Windows -p:DebugType=None
      - name: Verify audio analysis
        shell: pwsh
        run: ./Test.ps1
      - name: Package
        shell: pwsh
        run: |
          Copy-Item licenses Windows/licenses -Recurse
          Copy-Item README.md,LICENSE Windows
          Compress-Archive -Path Windows/* -DestinationPath Harmoniq-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Harmoniq-Windows-x64
          path: Harmoniq-Windows-x64.zip
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Harmoniq-Windows-x64
      - name: Publish Windows download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then exit 0; fi
          gh release create v0.2.0 Harmoniq-Windows-x64.zip --target "$RELEASE_SHA" --title "Harmoniq v0.2.0" --notes "Windows x64 MVP (application name CrateScope 0.2). Self-contained .NET EXE, no Python required. Includes documentation and license notices. Synthetic audio tests passed; real-music accuracy, macOS and Rekordbox import validation remain open."
